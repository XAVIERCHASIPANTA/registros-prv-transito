name: registros_prv_transito
description: "Registros PRV Tránsito - App para digitalizar partes de ingreso y libertad de vehículos en el CRV mediante OCR"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  pdf: ^3.11.1
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Cámara / galería
  image_picker: ^1.1.2

  # OCR en el dispositivo (Google ML Kit)
  google_mlkit_text_recognition: ^0.13.0

  # Seleccionar archivos PDF desde el almacenamiento
  file_picker: ^8.1.2

  # Leer el texto de un PDF digital (parte policial Ecu911) como
  # respaldo sin conexión — el camino principal ahora es leerlo con IA
  # (ver "printing" abajo), esto solo se usa si no hay internet/API key
  # o si la IA no logra leer nada.
  syncfusion_flutter_pdf: ^27.2.4

  # Convierte cada página de un PDF en una imagen (PNG), para poder
  # mandarlas a Gemini Vision exactamente igual que una foto — así la
  # lectura de un parte digital ya no depende de que el texto interno
  # del PDF venga en un orden predecible (varía de patio en patio).
  printing: ^5.13.4

  # Llamadas a la API de Gemini (lee las fotos con IA en vez de OCR local)
  http: ^1.2.0

  # Abrir el navegador para crear la API key de Gemini
  url_launcher: ^6.3.1

  # Manejo de archivos y rutas
  path_provider: ^2.1.3
  path: ^1.9.0

  # Editar el .docx (es un ZIP con XML dentro)
  archive: ^3.6.1
  xml: ^6.5.0

  # Guardar los casos como JSON localmente (banco de datos simple)
  # (se usa dart:convert + File, no requiere paquete extra)

  # Abrir el Word generado con la app instalada en el teléfono (Word, WPS, etc.)
  open_filex: ^4.5.0

  # Compartir el Word (WhatsApp, correo, etc.)
  share_plus: ^10.0.2

  # Permisos de cámara/almacenamiento
  permission_handler: ^11.3.1

  provider: ^6.1.2

  # Firebase: login, aprobación de usuarios y base de datos nacional
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  google_sign_in: ^6.2.1
  shared_preferences: ^2.5.5
  excel: ^4.0.6
  google_generative_ai: ^0.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

# Fuerza esta dependencia interna a una versión más vieja: las versiones
# recientes exigen compilar contra Android 36, y la instalación de
# Flutter/Android SDK de este equipo todavía está en 34/33.
dependency_overrides:
  flutter_plugin_android_lifecycle: 2.0.20

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
    - assets/sello_prv.png
    - assets/eagle_splash.png
