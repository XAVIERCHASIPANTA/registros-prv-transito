<!DOCTYPE html>
<html lang="es">
<head>
  <base href="/registros-prv-transito/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Sistema Nacional de Registros de Ingreso y Libertad de Vehículos en Centros de Retención Vehicular (CRV) - Policía Nacional del Ecuador">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- Evitar caché obsoleta en navegadores móviles durante desarrollo continuo -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- Theme Color para PWA en Android y navegadores -->
  <meta name="theme-color" content="#17356E">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PRV Tránsito">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>REGISTROS PRV TRANSITO - Policía Nacional del Ecuador</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      background-color: #17356E;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: Roboto, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: white;
      text-align: center;
    }
    .loading-spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      border-top-color: #5BA3F5;
      animation: spin 1s ease-in-out infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading" class="loading-container">
    <div class="loading-spinner"></div>
    <div style="font-weight: bold; font-size: 16px; letter-spacing: 0.5px;">REGISTROS PRV TRANSITO</div>
    <div style="font-size: 12px; color: rgba(255,255,255,0.7); margin-top: 6px;">Cargando aplicación PWA...</div>
  </div>
  <script>
    const APP_VERSION = '1.1.21';
    const lastVersion = localStorage.getItem('prv_app_version');
    if (lastVersion !== APP_VERSION) {
      localStorage.setItem('prv_app_version', APP_VERSION);
      if ('caches' in window) {
        caches.keys().then(function (names) {
          for (var name of names) {
            caches.delete(name);
          }
        });
      }
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (registrations) {
          for (var reg of registrations) {
            reg.unregister();
          }
        });
      }
    }

    // PWA Install Prompt Listener
    let prvInstallPrompt = null;
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      prvInstallPrompt = e;
      window.prvInstallPrompt = e;
      console.log('PWA beforeinstallprompt capturado con éxito');
    });

    window.instalarPWA = function () {
      if (window.prvInstallPrompt) {
        window.prvInstallPrompt.prompt();
        window.prvInstallPrompt.userChoice.then(function (choiceResult) {
          if (choiceResult.outcome === 'accepted') {
            console.log('Usuario aceptó instalar la PWA');
          }
          window.prvInstallPrompt = null;
        });
        return true;
      }
      return false;
    };

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js?v=1.1.23')
          .then(function (reg) {
            reg.onupdatefound = function () {
              var installingWorker = reg.installing;
              if (installingWorker) {
                installingWorker.onstatechange = function () {
                  if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    console.log('Nueva versión detectada. Recargando para actualizar...');
                    window.location.reload();
                  }
                };
              }
            };
          })
          .catch(function (err) {
            console.warn('Registro de Service Worker omitido o no compatible:', err);
          });
      });
    }
  </script>
  <script src="flutter_bootstrap.js?v=1.1.23" async></script>
</body>
</html>
